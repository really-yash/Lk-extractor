name: Extract MTK Physical Offsets

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to the OTA zip'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global-ota_full-OS2.0.208.0.VGQINXM-user-15.0-93391672cc.zip'

jobs:
  extract-offsets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Go, Device Tree Compiler, LZMA)
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler wget unzip liblzma-dev
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install payload-dumper-go
        run: go install github.com/ssut/payload-dumper-go@latest

      - name: Download Magiskboot
        run: |
          echo "Downloading official Magisk APK..."
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          echo "Extracting magiskboot binary from APK..."
          unzip -j magisk.apk lib/x86_64/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/magiskboot

      - name: Download OTA ROM
        run: |
          echo "Downloading ROM from ${{ github.event.inputs.rom_url }}"
          wget -O rom.zip "${{ github.event.inputs.rom_url }}"

      - name: Extract payload.bin
        run: unzip rom.zip payload.bin

      - name: Dump vendor_boot.img
        run: |
          echo "Extracting vendor_boot partition..."
          ~/go/bin/payload-dumper-go -p vendor_boot payload.bin
          mkdir -p workspace
          mv extracted_*/*.img workspace/

      - name: Unpack vendor_boot and Extract Offsets
        working-directory: workspace
        run: |
          echo "Unpacking vendor_boot image..."
          magiskboot unpack vendor_boot.img
          
          if [ ! -f "dtb" ]; then
            echo "No DTB found in vendor_boot.img!"
            exit 1
          fi
          
          echo "Using fdtdump to bypass MediaTek headers..."
          fdtdump dtb > decompiled_tree.dts
          
          echo "======================================"
          echo "      EXTRACTED PHYSICAL OFFSETS      "
          echo "======================================"
          echo "Searching for DRAM base..."
          grep -A 3 "memory@" decompiled_tree.dts || echo "Memory node not found."
          echo "======================================"
          
      - name: Upload Decompiled DTS (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: MTK-Device-Tree-Source
          path: workspace/decompiled_tree.dts

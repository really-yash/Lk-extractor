name: Extract Fastboot Boot and Vendor Boot

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to the Fastboot TGZ ROM'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.208.0.VGQINXM/air_in_global_images_OS2.0.208.0.VGQINXM_20260804.0000.00_15.0_in_35b733efaa.tgz'

jobs:
  extract_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Fastboot ROM
        run: |
          echo "Downloading Fastboot ROM archive..."
          wget -q "${{ github.event.inputs.rom_url }}" -O rom.tgz

      - name: Extract Target Images
        run: |
          mkdir output
          echo "Extracting boot.img and vendor_boot.img from archive..."
          tar -zxvf rom.tgz --wildcards '*/images/boot.img' '*/images/vendor_boot.img'
          
          # Move extracted images to output directory
          find . -type f -name "boot.img" -exec mv {} output/ \;
          find . -type f -name "vendor_boot.img" -exec mv {} output/ \;

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fastboot-imgs-${{ github.run_id }}
          name: "HyperOS Fastboot Boot & Vendor Boot"
          body: "Extracted directly from official Fastboot ROM OS2.0.208.0.VGQINXM."
          files: output/*.img
